<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <div class="greet">
            <div class="greet_box">
                <p class="greet_box--text">Привіт! <br>
                    Ви потрапили на сайт інтерактивних ігор та завдань<br>
                    Надіємось, що вам сподобається і ви отримаєте позитивні емоції! <br>
                    Бажаємо Вам гарно провести час!</p>
                <div class="greet_box--info">
                    <p class="greet_box--info--title">Введіть своє ім’я:</p>
                    <input class="greet_box--info--input" type="text" placeholder="Ваше ім’я...">
                    <button class="greet_box--info--button">Зберегти</button>
                </div>
            </div>
            <img class="greet_box--sword" src="./img/sword.svg" alt="sword">
            <img class="greet_box--puzzle" src="./img/puzzle.svg" alt="puzzle">
            <img class="greet_box--gamedevelopment" src="./img/gamedevelopment.svg" alt="gamedevelopment">
            <img class="greet_box--tictac" src="./img/tictac.svg" alt="tictac">
        </div>
        <div class="header_box">
            <div class="header_box--info">
                <img class="header_box--info--img" src="./img/Group 4.svg" alt="logo">
                <div class="header_box--info--nav">
                    <button class="header_box--info--nav--select" id="btnOpenSelect">Інтерактив <span><img id="arrow"
                                src="./img/arrow.svg" alt="arrow"></span></button>
                    <a href="#" class="header_box--info--nav--link">Наша команда</a>
                    <a href="#" class="header_box--info--nav--link">Контакти</a>
                </div>
            </div>
            <div class="select--box" id="select">
                <!-- <div style="position:absolute;width:1px;height:10px;background-color: black;top:0px;left:0px;"></div> -->
                <button class="select--box--option">Числовий</button>
                <button class="select--box--option">Ігровий</button>
                <button class="select--box--option">Ознайомчий</button>
            </div>
            <div class="header_box--user">
                <button class="header_box--user--button" id="btnTheme">
                    <!-- <img id="sun" class="header_box--user--button--sun" src="./img/sun.svg" alt="sun"> -->
                    <!-- <img id="moon" class="header_box--user--button--moon" src="./img/moon.svg" alt="moon"> -->

                    <img id="img" class="header_box--user--button--sun" src="./img/sun.svg" alt="sun">
                </button>
                <h4 class="header_box--user--text">Вітаємо, <span>User</span> !</h4>
            </div>
        </div>
    </header>
    <script src="js/select.js"></script>
    <script src="js/theme.js"></script>
</body>

</html>
