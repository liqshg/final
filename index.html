<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <div class="header_box">
            <div class="header_box--info">
                <img class="header_box--info--img" src="./img/Group 4.svg" alt="logo">
                <div class="header_box--info--nav">
                    <button class="header_box--info--nav--select" id="btn-openSelect">Інтерактив <span><img src="./img/arrow.svg"
                                alt="arrow"></span></button>
                    <a href="#" class="header_box--info--nav--link">Наша команда</a>
                    <a href="#" class="header_box--info--nav--link">Контакти</a>
                </div>
            </div>
        <div class="select--box">
            <button class="select--box--option">Числовий</button>
            <button class="select--box--option">Ігровий</button>
            <button class="select--box--option">Ознайомчий</button>
        </div>
            <div class="header_box--user">
                <button class="header_box--user--button">
                    <img class="header_box--user--button--sun" src="./img/sun.svg" alt="sun">
                    <img class="header_box--user--button--moon" src="./img/moon.svg" alt="moon">
                </button>
                <h4 class="header_box--user--text">Вітаємо, <span>User</span> !</h4>
            </div>
        </div>
    </header>
    <script src="script.js"></script>
</body>

</html>
